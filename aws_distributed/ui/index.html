<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Distributed Boltz</title><style>body{font:16px system-ui;max-width:1000px;margin:3rem auto;padding:0 1rem;color:#17202a}button,input{padding:.65rem;margin:.25rem}table{width:100%;border-collapse:collapse}td,th{padding:.6rem;border-bottom:1px solid #ddd;text-align:left}.pill{padding:.2rem .5rem;border-radius:1rem;background:#e8eef8}</style></head><body><h1>Distributed Boltz workflows</h1><p>Submit a Boltz YAML or FASTA input, track its CPU/GPU stages, and inspect published result assets.</p><input id="file" type="file" accept=".yaml,.yml,.fasta,.fa"><button onclick="submitJob()">Upload and submit</button><span id="notice"></span><h2>Jobs</h2><table><thead><tr><th>Job</th><th>Status</th><th>Created</th><th>Results</th></tr></thead><tbody id="jobs"></tbody></table><script>
const headers={'X-Researcher-Id':'local-researcher'};
async function submitJob(){const f=document.querySelector('#file').files[0];if(!f)return;notice.textContent='Uploading…';let u=await fetch('/api/uploads',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,content_type:f.type||'application/octet-stream'})}).then(r=>r.json());await fetch(u.upload_url,{method:'PUT',headers:{'Content-Type':f.type||'application/octet-stream','x-amz-server-side-encryption':'AES256'},body:f});await fetch('/api/jobs',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({job_id:u.job_id,input_key:u.input_key,idempotency_key:crypto.randomUUID()})});notice.textContent='Queued';load()}
async function assets(id){let x=await fetch(`/api/jobs/${id}/assets`,{headers}).then(r=>r.json());let w=open('','results');w.document.write('<h1>Result assets</h1>'+x.assets.map(a=>`<p><a href="${a.url}">${a.name}</a> (${a.media_type})</p>`).join(''))}
async function load(){let rows=await fetch('/api/jobs',{headers}).then(r=>r.json());jobs.innerHTML=rows.map(j=>`<tr><td>${j.job_id}</td><td><span class="pill">${j.status}</span></td><td>${new Date(j.created_at).toLocaleString()}</td><td>${j.status==='SUCCEEDED'?`<button onclick="assets('${j.job_id}')">View assets</button>`:''}</td></tr>`).join('')}load();setInterval(load,5000)</script></body></html>
