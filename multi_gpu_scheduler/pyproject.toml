[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "boltz-multi-gpu-scheduler"
version = "0.1.0"
description = "Controlled multi-GPU scheduling experiments for Boltz-2"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
experiment = ["biopython>=1.84,<1.87", "matplotlib>=3.9,<3.11"]

[project.scripts]
boltz-profile-job = "experiments.profile_job:main"
boltz-profiles-to-csv = "experiments.profiles_to_csv:main"
boltz-prepare-simulation = "experiments.prepare_simulation:main"
boltz-crossfit-trace = "experiments.crossfit_trace:main"
boltz-scheduler-simulate = "experiments.scheduler_simulation:main"
boltz-train-predictor = "experiments.train_predictor:main"
boltz-live = "experiments.live_scheduler:main"
boltz-compare-live = "experiments.compare_live:main"
boltz-benchmark = "experiments.benchmark:main"
boltz-campaign = "experiments.campaign:main"
boltz-vm = "experiments.vm_handoff:main"

[tool.setuptools.packages.find]
include = ["scheduling*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
