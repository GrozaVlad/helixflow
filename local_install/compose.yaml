services:
  boltz-local:
    build:
      context: .
    image: boltz2-local:2.2.1
    container_name: boltz2-local
    ports:
      - "127.0.0.1:${BOLTZ_PORT:-8000}:8000"
    volumes:
      - ./cache:/workspace/cache
      - ./data/inputs:/workspace/data/inputs
      - ./data/outputs:/workspace/data/outputs
    environment:
      BOLTZ_CACHE: /workspace/cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    shm_size: "8gb"
    restart: unless-stopped

