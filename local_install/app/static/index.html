<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Boltz-2</title>
  <link rel="stylesheet" href="/static/molstar/molstar.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">LOCAL GPU INFERENCE</p>
        <h1>Boltz-2 Workbench</h1>
        <p class="sub">Submit biomolecular structures to your NVIDIA GPU and inspect the generated artifacts.</p>
      </div>
      <div id="health" class="health">Checking GPU…</div>
    </header>

    <section class="panel">
      <form id="job-form">
        <label class="drop">
          <span>YAML or FASTA input</span>
          <input id="file" name="file" type="file" accept=".yaml,.yml,.fasta,.fa" required>
          <small>Choose a YAML or FASTA file from this machine. YAML is recommended.</small>
        </label>
        <div class="grid">
          <label>Recycling steps<input name="recycling_steps" type="number" min="1" max="10" value="3"></label>
          <label>Sampling steps<input name="sampling_steps" type="number" min="20" max="500" value="200"></label>
          <label>Diffusion samples<input name="diffusion_samples" type="number" min="1" max="5" value="1"></label>
        </div>
        <div class="checks">
          <label><input name="use_msa_server" type="checkbox" checked> Generate MSA using ColabFold</label>
          <label><input name="use_potentials" type="checkbox"> Use physical potentials</label>
          <label><input name="override" type="checkbox"> Force recomputation</label>
        </div>
        <button type="submit">Run prediction</button>
        <span id="submit-status"></span>
      </form>
    </section>

    <section>
      <div class="section-title"><h2>Jobs</h2><button class="secondary" id="refresh">Refresh</button></div>
      <div id="jobs" class="jobs"><p class="muted">No jobs submitted in this session.</p></div>
    </section>
  </main>
  <div id="viewer-modal" class="viewer-modal" hidden>
    <div class="viewer-shell">
      <div class="viewer-header"><div><strong id="viewer-title">3D structure</strong><span id="viewer-status">Loading…</span></div><button class="secondary" type="button" onclick="closeViewer()">Close</button></div>
      <div id="molstar-viewer"></div>
    </div>
  </div>
  <script src="/static/molstar/molstar.js"></script>
  <script src="/static/viewer.js?v=20261116-colour-fix"></script>
  <script src="/static/app.js"></script>
</body>
</html>
