# Reviewer/user installation: pulls the published browser image; never builds.
services:
  boltz-local:
    image: ${HELIXFLOW_IMAGE:-grozavlad/helixflow:local-setup}
    ports:
      - "127.0.0.1:${BOLTZ_PORT:-8000}:8000"
    volumes:
      - ./cache:/workspace/cache
      - ./data/inputs:/workspace/data/inputs
      - ./data/outputs:/workspace/data/outputs
    environment:
      BOLTZ_CACHE: /workspace/cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    shm_size: "8gb"
    restart: unless-stopped
